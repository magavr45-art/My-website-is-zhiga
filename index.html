<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Animated Email Eater</title>


<style>

/* ================================
   ОСНОВА
================================ */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at 50% 20%,
            #253044 0%,
            #111824 45%,
            #080d15 100%
        );

    color: white;
}


body {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow-x: hidden;
}


/* ================================
   ГЛАВНАЯ КАРТОЧКА
================================ */

.app {

    width: min(1400px, 94vw);

    min-height: 780px;

    padding: 50px;

    position: relative;

    overflow: hidden;

    border-radius: 36px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.08),
            rgba(255,255,255,.025)
        );

    border: 1px solid rgba(255,255,255,.12);

    box-shadow:
        0 40px 100px rgba(0,0,0,.55),
        inset 0 1px rgba(255,255,255,.1);
}


/* декоративное свечение */

.app::before {

    content: "";

    position: absolute;

    width: 600px;
    height: 600px;

    left: -250px;
    top: -300px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(177,255,65,.15),
            transparent 70%
        );

    pointer-events: none;
}


.app::after {

    content: "";

    position: absolute;

    width: 500px;
    height: 500px;

    right: -250px;
    bottom: -250px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,91,151,.13),
            transparent 70%
        );

    pointer-events: none;
}


/* ================================
   ЗАГОЛОВОК
================================ */

.title {

    text-align: center;

    font-size:
        clamp(34px, 5vw, 68px);

    font-weight: 900;

    letter-spacing: -2px;

    margin: 0 0 50px;

    text-shadow:
        0 8px 30px rgba(0,0,0,.4);
}


.title span {

    color: #b5ff3d;

    text-shadow:
        0 0 30px rgba(181,255,61,.3);
}


/* ================================
   СЦЕНА
================================ */

.scene {

    width: 100%;

    height: 520px;

    position: relative;

    overflow: hidden;

    border-radius: 30px;

    background:

        radial-gradient(
            ellipse at 50% 45%,
            rgba(255,255,255,.9),
            rgba(255,246,249,.96) 45%,
            rgba(255,231,238,.96)
        );

    box-shadow:
        inset 0 0 80px rgba(255,255,255,.8),
        0 30px 70px rgba(0,0,0,.2);
}


/* ================================
   ОБЛАКО
================================ */

.cloud {

    position: absolute;

    width: 700px;
    height: 260px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse,
            rgba(255,255,255,.95),
            rgba(255,255,255,.55),
            transparent 72%
        );

    filter: blur(2px);

    pointer-events: none;
}


/* ================================
   EMAIL BOX
================================ */

.email-box {

    position: absolute;

    left: 8%;

    top: 48%;

    transform:
        translateY(-50%);

    width: min(520px, 48%);

    height: 82px;

    padding: 8px;

    display: flex;

    align-items: center;

    border-radius: 50px;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #fff8fa
        );

    border: 3px solid #d74476;

    box-shadow:

        0 15px 35px rgba(185,50,94,.22),

        inset 0 2px 5px rgba(255,255,255,.9);

    z-index: 10;
}


.email-label {

    position: absolute;

    left: 34px;

    top: -25px;

    padding: 0 8px;

    background: #fff3f6;

    color: #a32651;

    font-size: 17px;

    font-weight: 800;
}


#emailInput {

    width: 100%;

    height: 100%;

    padding:
        0 28px;

    border: none;

    outline: none;

    background: transparent;

    color: #8e2349;

    font-size:
        clamp(17px, 2vw, 25px);

    font-weight: 800;
}


#emailInput::placeholder {

    color: #c56b8b;

    opacity: .7;
}


/* ================================
   КНОПКА
================================ */

.eat-button {

    position: absolute;

    left: calc(8% + 535px);

    top: 48%;

    transform:
        translateY(-50%);

    width: 76px;
    height: 76px;

    border: none;

    border-radius: 50%;

    cursor: pointer;

    background:

        radial-gradient(
            circle at 35% 30%,
            #fff59b,
            #ffd45a 45%,
            #ffad35 100%
        );

    box-shadow:

        0 10px 25px rgba(255,165,45,.4),

        inset 0 4px 8px rgba(255,255,255,.7),

        inset 0 -5px 8px rgba(160,80,0,.15);

    font-size: 30px;

    z-index: 30;

    transition:
        transform .2s ease;
}


.eat-button:hover {

    transform:
        translateY(-50%)
        scale(1.12)
        rotate(8deg);
}


.eat-button:active {

    transform:
        translateY(-50%)
        scale(.92);
}


/* ================================
   ПЕРСОНАЖ
================================ */

.character {

    position: absolute;

    width: 300px;
    height: 300px;

    right: 7%;

    top: 42%;

    transform:
        translateY(-50%);

    z-index: 15;

    animation:
        characterFloat 3s ease-in-out infinite;
}


/* тень */

.character-shadow {

    position: absolute;

    width: 190px;
    height: 35px;

    left: 55px;
    bottom: 5px;

    border-radius: 50%;

    background:
        rgba(100,20,45,.18);

    filter: blur(12px);
}


/* тело SVG */

.character svg {

    width: 100%;
    height: 100%;

    overflow: visible;

    filter:
        drop-shadow(
            0 20px 20px
            rgba(80,20,45,.18)
        );
}


/* рот */

.mouth {

    transform-box: fill-box;

    transform-origin: center;

    transition:
        transform .12s ease,
        d .12s ease;
}


/* ================================
   ПОПАДАНИЕ
================================ */

.character.eating {

    animation:
        characterEat .32s ease;
}


.character.eating .mouth {

    transform:
        scale(1.45, 1.8);
}


/* ================================
   БУКВЫ
================================ */

.fly-layer {

    position: absolute;

    inset: 0;

    pointer-events: none;

    z-index: 50;
}


.letter {

    position: absolute;

    left: 0;
    top: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    min-width: 18px;

    padding: 3px 6px;

    border-radius: 8px;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #fff4f7
        );

    border: 2px solid #d74476;

    color: #9b2850;

    font-size:
        clamp(17px, 2vw, 25px);

    font-weight: 900;

    box-shadow:
        0 8px 20px rgba(130,30,65,.25);

    will-change:
        transform,
        opacity;

    transform-origin: center;
}


/* ================================
   ЭФФЕКТ ПРОГЛАТЫВАНИЯ
================================ */

.swallow {

    position: absolute;

    width: 120px;
    height: 120px;

    border-radius: 50%;

    border: 5px solid rgba(255,75,130,.5);

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(.2);

    opacity: 0;

    pointer-events: none;

    z-index: 60;
}


.swallow.active {

    animation:
        swallowEffect .55s ease-out;
}


/* ================================
   ЗВЁЗДОЧКИ
================================ */

.spark {

    position: absolute;

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #b5ff3d;

    pointer-events: none;

    z-index: 70;

    animation:
        sparkFly .7s ease-out forwards;
}


/* ================================
   ПОДСКАЗКА
================================ */

.hint {

    text-align: center;

    margin-top: 28px;

    color: rgba(255,255,255,.6);

    font-size: 16px;
}


/* ================================
   АНИМАЦИИ
================================ */

@keyframes characterFloat {

    0%,
    100% {

        transform:
            translateY(-50%);
    }

    50% {

        transform:
            translateY(calc(-50% - 12px));
    }
}


@keyframes characterEat {

    0% {
        transform:
            translateY(-50%)
            scale(1);
    }

    40% {
        transform:
            translateY(-50%)
            scale(1.08);
    }

    100% {
        transform:
            translateY(-50%)
            scale(1);
    }
}


@keyframes swallowEffect {

    0% {

        opacity: .8;

        transform:
            translate(-50%, -50%)
            scale(.2);
    }

    100% {

        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(1.8);
    }
}


@keyframes sparkFly {

    0% {

        opacity: 1;

        transform:
            translate(0,0)
            scale(1);
    }

    100% {

        opacity: 0;

        transform:
            translate(
                var(--sx),
                var(--sy)
            )
            scale(.1);
    }
}


/* ================================
   ТЕЛЕФОН
================================ */

@media (max-width: 900px) {

    .app {

        padding: 25px;

        min-height: 700px;
    }


    .scene {

        height: 600px;
    }


    .email-box {

        width: 70%;

        left: 50%;

        top: 18%;

        transform:
            translateX(-50%);
    }


    .eat-button {

        left: auto;

        right: 8%;

        top: 18%;

        transform:
            translateY(-50%);
    }


    .eat-button:hover {

        transform:
            translateY(-50%)
            scale(1.1);
    }


    .character {

        width: 290px;
        height: 290px;

        right: 50%;

        top: 62%;

        transform:
            translate(50%, -50%);
    }
}


@media (max-width: 600px) {

    .app {

        width: 100%;

        min-height: 100vh;

        padding: 15px;

        border-radius: 0;
    }


    .title {

        margin-bottom: 25px;
    }


    .scene {

        height: 650px;

        border-radius: 22px;
    }


    .email-box {

        width: 78%;

        height: 64px;

        top: 16%;
    }


    .email-label {

        left: 22px;

        font-size: 14px;
    }


    #emailInput {

        font-size: 16px;

        padding: 0 18px;
    }


    .eat-button {

        width: 60px;
        height: 60px;

        font-size: 24px;

        right: 3%;
    }


    .character {

        width: 250px;
        height: 250px;

        top: 62%;
    }
}

</style>

</head>


<body>


<div class="app">


    <h1 class="title">

        Animated
        <span>Email</span>
        Eater

    </h1>


    <div class="scene">


        <div class="cloud"></div>


        <!-- EMAIL -->

        <div class="email-box">

            <div class="email-label">
                Email
            </div>

            <input
                id="emailInput"
                type="text"
                autocomplete="off"
                placeholder="hello@gmail.com"
            >

        </div>


        <!-- КНОПКА -->

        <button
            class="eat-button"
            id="eatButton"
            aria-label="Съесть текст"
        >

            ⭐

        </button>


        <!-- ПЕРСОНАЖ -->

        <div
            class="character"
            id="character"
        >

            <div class="character-shadow"></div>


            <svg
                viewBox="0 0 300 300"
                xmlns="http://www.w3.org/2000/svg"
            >

                <!-- левая нога -->

                <ellipse
                    cx="91"
                    cy="252"
                    rx="58"
                    ry="28"
                    fill="#ef3f70"
                    stroke="#8c2349"
                    stroke-width="5"
                />


                <!-- правая нога -->

                <ellipse
                    cx="210"
                    cy="252"
                    rx="58"
                    ry="28"
                    fill="#ef3f70"
                    stroke="#8c2349"
                    stroke-width="5"
                />


                <!-- тело -->

                <path
                    d="
                    M55 135
                    C55 70 105 35 150 35
                    C205 35 250 73 250 135
                    C250 195 211 230 150 230
                    C90 230 55 195 55 135
                    Z
                    "
                    fill="#ffb9ca"
                    stroke="#8c2349"
                    stroke-width="5"
                />


                <!-- свет на лице -->

                <ellipse
                    cx="118"
                    cy="95"
                    rx="45"
                    ry="25"
                    fill="rgba(255,255,255,.28)"
                />


                <!-- левый глаз -->

                <rect
                    x="108"
                    y="105"
                    width="10"
                    height="35"
                    rx="5"
                    fill="#8c2349"
                />


                <!-- правый глаз -->

                <rect
                    x="155"
                    y="105"
                    width="10"
                    height="35"
                    rx="5"
                    fill="#8c2349"
                />


                <!-- щёки -->

                <ellipse
                    cx="92"
                    cy="155"
                    rx="25"
                    ry="12"
                    fill="#f27d9e"
                    opacity=".45"
                />

                <ellipse
                    cx="190"
                    cy="155"
                    rx="25"
                    ry="12"
                    fill="#f27d9e"
                    opacity=".45"
                />


                <!-- рот -->

                <ellipse
                    class="mouth"
                    id="mouth"
                    cx="138"
                    cy="157"
                    rx="24"
                    ry="10"
                    fill="#8c2349"
                />


                <!-- маленький язычок -->

                <ellipse
                    cx="138"
                    cy="163"
                    rx="10"
                    ry="5"
                    fill="#ff668f"
                />


                <!-- блик -->

                <circle
                    cx="80"
                    cy="82"
                    r="8"
                    fill="white"
                    opacity=".7"
                />

            </svg>

        </div>


        <!-- СЮДА ЛЕТЯТ БУКВЫ -->

        <div
            class="fly-layer"
            id="flyLayer"
        ></div>


        <!-- ЭФФЕКТ ПРОГЛАТЫВАНИЯ -->

        <div
            class="swallow"
            id="swallow"
        ></div>


    </div>


    <div class="hint">

        Напиши Email и нажми ⭐ — персонаж съест каждую букву отдельно

    </div>


</div>


<script>

/* =====================================
   ПОЛУЧАЕМ ЭЛЕМЕНТЫ
===================================== */

const input =
    document.getElementById("emailInput");

const button =
    document.getElementById("eatButton");

const character =
    document.getElementById("character");

const flyLayer =
    document.getElementById("flyLayer");

const swallow =
    document.getElementById("swallow");

const scene =
    document.querySelector(".scene");


/* =====================================
   ЗВУК
===================================== */

let audioContext = null;


function eatSound() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
    }


    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();


    oscillator.type = "sine";


    oscillator.frequency.setValueAtTime(
        260,
        audioContext.currentTime
    );


    oscillator.frequency.exponentialRampToValueAtTime(
        90,
        audioContext.currentTime + .22
    );


    gain.gain.setValueAtTime(
        .12,
        audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime + .25
    );


    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );


    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + .25
    );
}


/* =====================================
   СОЗДАЁМ ЗВЁЗДЫ
===================================== */

function createSparks() {

    for (
        let i = 0;
        i < 12;
        i++
    ) {

        const spark =
            document.createElement("div");


        spark.className =
            "spark";


        spark.style.left =
            "50%";

        spark.style.top =
            "50%";


        const angle =
            Math.random() *
            Math.PI *
            2;


        const distance =
            40 +
            Math.random() * 90;


        spark.style.setProperty(
            "--sx",
            `${Math.cos(angle) * distance}px`
        );


        spark.style.setProperty(
            "--sy",
            `${Math.sin(angle) * distance}px`
        );


        scene.appendChild(spark);


        setTimeout(
            () => spark.remove(),
            750
        );
    }
}


/* =====================================
   ПОЛУЧАЕМ ПОЗИЦИЮ РТА
===================================== */

function getMouthPosition() {

    const sceneRect =
        scene.getBoundingClientRect();

    const mouthRect =
        document
            .getElementById("mouth")
            .getBoundingClientRect();


    return {

        x:
            mouthRect.left +
            mouthRect.width / 2 -
            sceneRect.left,

        y:
            mouthRect.top +
            mouthRect.height / 2 -
            sceneRect.top
    };
}


/* =====================================
   ПОЛУЧАЕМ ПОЗИЦИЮ ТЕКСТА
===================================== */

function getStartPosition(index) {

    const sceneRect =
        scene.getBoundingClientRect();

    const inputRect =
        input.getBoundingClientRect();


    const text =
        input.value;


    /*
       Примерная ширина символа.
       Каждый символ получает
       отдельную начальную позицию.
    */

    const fontSize =
        parseFloat(
            getComputedStyle(input).fontSize
        );


    const averageWidth =
        fontSize * .58;


    return {

        x:
            inputRect.left -
            sceneRect.left +
            30 +
            index * averageWidth,

        y:
            inputRect.top -
            sceneRect.top +
            inputRect.height / 2
    };
}


/* =====================================
   БЕЗОПАСНАЯ ФУНКЦИЯ
   QUADRATIC BEZIER
===================================== */

function bezierPoint(
    p0,
    p1,
    p2,
    t
) {

    const x =
        (1 - t) *
        (1 - t) *
        p0.x
        +
        2 *
        (1 - t) *
        t *
        p1.x
        +
        t *
        t *
        p2.x;


    const y =
        (1 - t) *
        (1 - t) *
        p0.y
        +
        2 *
        (1 - t) *
        t *
        p1.y
        +
        t *
        t *
        p2.y;


    return {
        x,
        y
    };
}


/* =====================================
   ОДНА БУКВА
===================================== */

function animateLetter(
    letter,
    index,
    total
) {

    const start =
        getStartPosition(index);


    const target =
        getMouthPosition();


    /*
       Каждой букве
       своя дуга.
    */

    const curveDirection =
        index % 2 === 0
            ? -1
            : 1;


    const curveAmount =
        40 +
        Math.random() * 80;


    const control = {

        x:
            (start.x + target.x) / 2,

        y:
            (start.y + target.y) / 2
            +
            curveDirection *
            curveAmount
    };


    const rotation =
        (Math.random() - .5) * 80;


    const duration =
        850 +
        index * 45;


    const startTime =
        performance.now();


    function animate(now) {

        const elapsed =
            now - startTime;


        let t =
            elapsed / duration;


        if (t > 1)
            t = 1;


        /*
           Плавное ускорение
        */

        const ease =
            t < .5
                ? 2 * t * t
                : 1 -
                  Math.pow(
                      -2 * t + 2,
                      2
                  ) / 2;


        const pos =
            bezierPoint(
                start,
                control,
                target,
                ease
            );


        const scale =
            1 -
            ease * .75;


        const currentRotation =
            rotation +
            ease * 220;


        letter.style.transform = `
            translate(
                ${pos.x}px,
                ${pos.y}px
            )
            translate(-50%, -50%)
            rotate(${currentRotation}deg)
            scale(${scale})
        `;


        /*
           После 65%
           начинаем исчезать.
        */

        if (ease > .65) {

            letter.style.opacity =
                String(
                    1 -
                    (ease - .65) /
                    .35
                );
        }


        /*
           Когда буква
           дошла до рта
        */

        if (t >= 1) {

            letter.remove();

            return;
        }


        requestAnimationFrame(
            animate
        );
    }


    requestAnimationFrame(
        animate
    );
}


/* =====================================
   ЗАПУСК
===================================== */

function eatText() {

    const text =
        input.value.trim();


    if (!text)
        return;


    /*
       Разделяем текст
       на отдельные символы.
    */

    const letters =
        [...text];


    /*
       Убираем текст
       из input.
    */

    input.value = "";


    /*
       Создаём буквы.
    */

    letters.forEach(
        (char, index) => {

            const letter =
                document.createElement("div");


            letter.className =
                "letter";


            /*
               Пробелы тоже летят,
               но становятся почти невидимыми.
            */

            if (char === " ") {

                letter.innerHTML =
                    "&nbsp;";

            } else {

                letter.textContent =
                    char;
            }


            const start =
                getStartPosition(index);


            letter.style.transform = `
                translate(
                    ${start.x}px,
                    ${start.y}px
                )
                translate(-50%, -50%)
            `;


            flyLayer.appendChild(
                letter
            );


            /*
               Небольшая задержка
               между буквами.
            */

            setTimeout(
                () => {

                    animateLetter(
                        letter,
                        index,
                        letters.length
                    );

                },
                index * 35
            );
        }
    );


    /*
       Персонаж начинает
       открывать рот.
    */

    setTimeout(
        () => {

            character.classList.add(
                "eating"
            );

        },
        500
    );


    /*
       Проглатывание.
    */

    setTimeout(
        () => {

            swallow.classList.remove(
                "active"
            );


            void swallow.offsetWidth;


            swallow.classList.add(
                "active"
            );


            eatSound();

            createSparks();

        },
        1000
    );


    /*
       Закрываем рот.
    */

    setTimeout(
        () => {

            character.classList.remove(
                "eating"
            );

        },
        1450
    );
}


/* =====================================
   КНОПКА
===================================== */

button.addEventListener(
    "click",
    eatText
);


/* =====================================
   ENTER
===================================== */

input.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            eatText();
        }
    }
);

</script>


</body>
